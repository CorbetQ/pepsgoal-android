name: Play Store assets

# Captures d'écran de la fiche Play Store (français et anglais, thème clair et sombre) sur un émulateur,
# avec les données de démonstration, plus les textes de la fiche (metadata/android). À lancer à la main.
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK debug
        run: ./gradlew --no-daemon :app:assembleGithubDebug
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Captures
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/play-shots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: play-store-assets
          path: |
            shots/
            metadata/android/
            docs/play-declarations.md
          if-no-files-found: error
