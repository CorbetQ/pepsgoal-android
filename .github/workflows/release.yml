name: Release

# Publie une release GitHub avec l'APK : à chaque tag de version (ex. v3.0.0), et à chaque mise à jour de main
# (version lue dans app/build.gradle.kts ; la release de cette version est créée, ou mise à jour si elle existe)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then v="$GITHUB_REF_NAME"; else v="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"; fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Tests de la logique (module core)
        run: ./gradlew --no-daemon :core:test
      - name: Application Android
        run: ./gradlew --no-daemon :app:assembleRelease :wear:assembleRelease
      - name: Nom des APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk "PepsGoal-${VERSION}.apk"
          cp wear/build/outputs/apk/release/wear-release.apk "PepsGoal-Wear-${VERSION}.apk"
      - name: Notes de version
        run: |
          python3 - <<'PY'
          import json, os
          v = os.environ["VERSION"].lstrip("v")
          notes = json.load(open("app/src/main/assets/docs/notes.json"))
          items = next((n[2] for n in notes if n[0] == v), [])
          body = "PepsGoal pour Android, application native (Kotlin, Jetpack Compose).\n\n" + "\n".join("- " + i for i in items)
          body += "\n\nAPK optimisé (version release, identifiant `fr.pepsgoal.app`), signé avec la clé de test du dépôt : les prochaines versions s'installeront par-dessus. Pas destiné au Play Store."
          body += "\n\n`PepsGoal-Wear` : application pour montre Wear OS (Wear OS 3 et plus), à installer sur la montre (par exemple avec `adb install` en débogage Wi-Fi) ; elle se synchronise avec l'application du téléphone."
          open("release-notes.md", "w").write(body)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: PepsGoal ${{ env.VERSION }}
          files: |
            PepsGoal-${{ env.VERSION }}.apk
            PepsGoal-Wear-${{ env.VERSION }}.apk
          body_path: release-notes.md
