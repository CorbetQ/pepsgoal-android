name: Android

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests de la logique (module core)
        run: ./gradlew --no-daemon :core:test
      - name: Application Android (debug + release)
        run: ./gradlew --no-daemon :app:assembleGithubDebug :app:assembleGithubRelease :app:bundlePlayRelease :wear:assembleRelease :wear:bundleRelease
      - name: Modules de mesure (Macrobenchmark et profil de référence, compilation)
        run: ./gradlew --no-daemon :benchmark:assemble :baselineprofile:assemble
      - uses: actions/upload-artifact@v4
        with:
          name: pepsgoal-apk
          path: |
            app/build/outputs/apk/*/*/*.apk
            wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
